<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="{{ site.url }}/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }} | BeeSEO</title>
<meta name="description" content="{{ page.description | default: 'Artigos sobre SEO, GEO e Marketing de Conteúdo por Débora Machado.' }}">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Poppins',sans-serif;background:#f5f5f5;color:#1a1a1a;}
a{text-decoration:none;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(245,245,245,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(0,0,0,.08);}
.nav-inner{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:14px 5%;}
.nav-logo{font-weight:800;font-size:1rem;color:#1a1a1a;}
.nav-logo span{background:linear-gradient(90deg,#e91e8c,#8b00e0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.nav-links{display:flex;gap:24px;list-style:none;}
.nav-links a{color:#6b7280;font-size:.85rem;font-weight:500;transition:.2s;}
.nav-links a:hover,.nav-links a.active{color:#1a1a1a;}
.nav-cta{padding:9px 22px;background:linear-gradient(90deg,#e91e8c,#8b00e0);color:white;border-radius:10px;font-size:.85rem;font-weight:700;transition:.3s;}
.nav-cta:hover{opacity:.85;}
.nav-toggle{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:4px;}
.nav-toggle span{display:block;width:22px;height:2px;background:#6b7280;border-radius:2px;}
@media(max-width:768px){
  .nav-links{display:none;}.nav-cta{display:none;}.nav-toggle{display:flex;}
  .nav-links.open{display:flex;flex-direction:column;position:absolute;top:100%;left:0;right:0;background:rgba(245,245,245,.98);padding:20px 5%;border-bottom:1px solid rgba(0,0,0,.08);gap:16px;}
}

/* HERO */
.blog-hero{padding:130px 5% 60px;max-width:1200px;margin:auto;}
.hero-tag{display:inline-block;padding:6px 16px;border-radius:30px;border:1px solid rgba(233,30,140,.35);color:#e91e8c;font-size:.82rem;font-weight:500;margin-bottom:20px;}
.blog-hero h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;line-height:1.15;margin-bottom:14px;}
.blog-hero h1 span{background:linear-gradient(90deg,#e91e8c,#8b00e0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.blog-hero p{color:#6b7280;font-size:1rem;max-width:520px;}

/* FILTROS */
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:0 5% 40px;max-width:1200px;margin:auto;}
.filter-btn{padding:8px 20px;border-radius:30px;border:1px solid rgba(0,0,0,.12);background:transparent;color:#6b7280;font-size:.82rem;font-weight:500;cursor:pointer;font-family:'Poppins',sans-serif;transition:.2s;}
.filter-btn:hover,.filter-btn.active{background:linear-gradient(90deg,#e91e8c,#8b00e0);color:white;border-color:transparent;}

/* CARD DESTAQUE */
.featured-wrap{max-width:1200px;margin:0 auto 40px;padding:0 5%;}
.featured-card{background:#fff;border-radius:24px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;min-height:320px;border:1px solid rgba(0,0,0,.06);transition:.3s;}
.featured-card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(233,30,140,.12);}
.featured-img{background:linear-gradient(135deg,rgba(233,30,140,.15),rgba(139,0,224,.15));display:flex;align-items:center;justify-content:center;min-height:280px;}
.featured-img svg{width:80px;height:80px;opacity:.3;}
.featured-body{padding:40px 36px;display:flex;flex-direction:column;justify-content:center;}
.featured-tag{display:inline-block;padding:4px 14px;border-radius:20px;background:rgba(233,30,140,.1);color:#e91e8c;font-size:.72rem;font-weight:700;margin-bottom:16px;}
.featured-title{font-size:1.5rem;font-weight:800;color:#1a1a1a;line-height:1.3;margin-bottom:12px;}
.featured-excerpt{color:#6b7280;font-size:.9rem;line-height:1.65;margin-bottom:24px;}
.featured-link{display:inline-flex;align-items:center;gap:6px;color:#e91e8c;font-size:.85rem;font-weight:700;transition:.2s;}
.featured-link:hover{gap:10px;}

/* GRID DE POSTS */
.posts-wrap{max-width:1200px;margin:0 auto 80px;padding:0 5%;}
.posts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
.post-card{background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:.3s;}
.post-card:hover{transform:translateY(-6px);box-shadow:0 12px 40px rgba(233,30,140,.1);border-color:rgba(233,30,140,.25);}
.post-card-img{height:140px;background:linear-gradient(135deg,rgba(233,30,140,.1),rgba(139,0,224,.1));display:flex;align-items:center;justify-content:center;}
.post-card-img svg{width:40px;height:40px;opacity:.25;}
.post-card-body{padding:22px 22px 26px;display:flex;flex-direction:column;flex:1;}
.post-card-tag{display:inline-block;padding:3px 12px;border-radius:20px;background:rgba(233,30,140,.08);color:#e91e8c;font-size:.68rem;font-weight:700;margin-bottom:12px;}
.post-card-title{font-size:1rem;font-weight:700;color:#1a1a1a;line-height:1.4;margin-bottom:10px;}
.post-card-title a{color:#1a1a1a;}
.post-card-title a:hover{color:#e91e8c;}
.post-card-excerpt{color:#6b7280;font-size:.82rem;line-height:1.6;flex:1;}
.post-card-meta{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid rgba(0,0,0,.06);}
.post-card-date{color:#9ca3af;font-size:.72rem;}
.post-card-read{color:#e91e8c;font-size:.72rem;font-weight:600;}

/* POST INDIVIDUAL */
.post-wrap{max-width:760px;margin:120px auto 80px;padding:0 5%;}
.post-header{margin-bottom:40px;}
.post-header .post-tag{display:inline-block;padding:5px 14px;border-radius:20px;background:rgba(233,30,140,.1);color:#e91e8c;font-size:.75rem;font-weight:700;margin-bottom:16px;}
.post-header h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;color:#1a1a1a;line-height:1.2;margin-bottom:14px;}
.post-header .meta{color:#9ca3af;font-size:.82rem;padding-bottom:24px;border-bottom:1px solid rgba(0,0,0,.08);}
.post-body{color:#374151;font-size:1rem;line-height:1.85;}
.post-body h2{font-size:1.4rem;font-weight:800;color:#1a1a1a;margin:40px 0 16px;}
.post-body h3{font-size:1.1rem;font-weight:700;color:#1a1a1a;margin:28px 0 12px;}
.post-body p{margin-bottom:18px;}
.post-body strong{color:#1a1a1a;}
.post-body a{color:#e91e8c;border-bottom:1px solid rgba(233,30,140,.25);}
.post-body blockquote{border-left:3px solid #e91e8c;padding:14px 20px;margin:24px 0;background:rgba(233,30,140,.05);border-radius:0 12px 12px 0;color:#4b5563;font-style:italic;}
.post-body hr{border:none;border-top:1px solid rgba(0,0,0,.08);margin:36px 0;}
.post-body ul,ol{margin:0 0 18px 24px;}
.post-body li{margin-bottom:8px;}

/* CTA FOOTER */
.cta-section{background:#1a1a1a;padding:70px 5%;text-align:center;}
.cta-section h2{font-size:clamp(1.4rem,3vw,2rem);font-weight:800;color:#fff;margin-bottom:12px;}
.cta-section p{color:#9ca3af;margin-bottom:28px;}
.cta-links{display:flex;justify-content:center;flex-wrap:wrap;gap:20px;}
.cta-links a{color:#e91e8c;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;}
.cta-links a:hover{opacity:.75;}

footer{background:#111;padding:24px 5%;text-align:center;color:#4b5563;font-size:.75rem;}

@media(max-width:768px){
  .featured-card{grid-template-columns:1fr;}
  .featured-img{min-height:160px;}
  .posts-grid{grid-template-columns:1fr;}
}
@media(min-width:769px) and (max-width:1024px){
  .posts-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="https://beeseo.com.br/">
  <img src="https://beeseo.com.br/logo_bee.png" alt="BeeSEO" style="height:44px;width:auto;display:block;">
</a>
    <ul class="nav-links" id="navLinks">
      <li><a href="https://beeseo.com.br/#servicos">Serviços</a></li>
      <li><a href="https://beeseo.com.br/#clientes">Projetos</a></li>

      <li><a href="https://beeseo.com.br/#sobre">Sobre</a></li>
      <li><a href="https://blog.beeseo.com.br/" class="active">Blog</a></li>
    </ul>
    <a href="https://wa.me/55SEUNUMEROAQUI" class="nav-cta">Contato</a>
    <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
  </div>
</nav>

</body>
</html>
