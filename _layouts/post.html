---
layout: default
---
<div class="post-wrap">
  <div class="post-header">
    <span class="post-tag">{{ page.tags | first }}</span>
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date | date: "%d/%m/%Y" }} • Débora Machado</p>
  </div>
  <div class="post-body">
    {{ content }}
  </div>
</div>
